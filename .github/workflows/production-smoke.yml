name: Production smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL publicada para validar
        required: true
        default: https://seocron-ashen.vercel.app/

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Vercel's generated deployment URL may require authentication even when
      # the canonical production alias is public.
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.url || 'https://seocron-ashen.vercel.app/' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate production
        run: npm run test:smoke

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
